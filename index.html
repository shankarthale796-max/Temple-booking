<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री गजानन महाराज संस्थान वडशेद - गुरुवार अन्नदान सेवा</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #c62828;
            --primary-dark: #8e0000;
            --secondary: #1b5e20;
            --gold: #d4af37;
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Tiro Devanagari Marathi', 'Poppins', serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ebd9b4 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 2px solid #f4e8c1;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .music-btn {
            background: #fff8e7;
            border: 2px solid var(--gold);
            color: #8a6d1c;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        .admin-btn {
            background: #2d3748;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Poppins', sans-serif;
        }

        .divine-header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #fff9eb 0%, #ffffff 100%);
            border-radius: 15px;
            border: 1px solid #f0e0b6;
            margin-bottom: 25px;
        }

        .grand-maharaj-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.7);
            margin-bottom: 15px;
        }

        .divine-header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin: 5px 0;
            font-weight: 700;
        }

        .divine-header p {
            font-size: 1.15rem;
            color: #555;
            margin: 0;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--primary);
            border-bottom: 2px solid #f4e8c1;
            padding-bottom: 8px;
            margin: 30px 0 18px 0;
            font-weight: bold;
        }

        .search-bar-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .search-input { flex: 2; min-width: 200px; }
        .filter-select { flex: 1; min-width: 140px; background: #fff; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
        }

        .card {
            border-radius: 16px;
            padding: 20px;
            background: #fff;
            border: 1px solid #e8e1d1;
            box-shadow: 0 6px 16px rgba(0,0,0,0.04);
            position: relative;
        }

        .card.booked { border-left: 6px solid var(--primary); background: #fff8f8; }
        .card.available { border-left: 6px solid var(--secondary); background: #f6fff6; }
        .card.completed { border-left: 6px solid #2b6cb0; background: #f0f7ff; }

        .date-title { font-size: 1.2rem; font-weight: bold; color: #1a202c; margin-bottom: 8px; }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge.booked { background-color: var(--primary); }
        .badge.available { background-color: var(--secondary); }
        .badge.completed { background-color: #2b6cb0; }

        .info-text { font-size: 0.95rem; line-height: 1.5; margin: 5px 0; color: #333; }

        .btn-book {
            display: block;
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: 'Tiro Devanagari Marathi', serif;
        }

        .btn-complete {
            background: linear-gradient(135deg, #2b6cb0 0%, #1a365d 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.88rem;
            font-weight: bold;
            width: 100%;
        }

        .btn-delete {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.82rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 18px;
            width: 90%;
            max-width: 450px;
            border: 2px solid #f4e8c1;
        }

        .modal-content h3 { margin-top: 0; color: var(--primary); font-size: 1.4rem; text-align: center; }
        .modal-content label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
        .modal-content input, .modal-content textarea { width: 100%; margin-top: 4px; padding: 9px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-family: inherit; }

        .modal-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
        .btn-cancel { background: #edf2f7; color: #4a5568; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; }
        .btn-submit { background: var(--secondary); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

<!-- Working Direct Audio File -->
<audio id="mantraAudio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/shankarthale796-max/assets/main/gan_gan_ganat_bote.mp3" type="audio/mpeg">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="top-controls">
        <button class="music-btn" onclick="toggleMusic()">
            <span id="musicIcon">🪕</span> <span id="musicText">मंत्रध्वनी सुरू करा</span>
        </button>
        <button id="toggleAdminBtn" class="admin-btn" onclick="toggleAdmin()">प्रशासक लॉगिन (Admin)</button>
    </div>
    
    <div class="divine-header">
        <!-- Exact photo path mapped to uploaded filename -->
        <img src="gajanan.jpg" alt="श्री गजानन महाराज" class="grand-maharaj-img" id="maharajPhoto" onerror="this.src='gajanan.png'">
        <h1>🛕 श्री गजानन महाराज संस्थान वडशेद (जुने)</h1>
        <p>गुरुवार महाप्रसाद / अन्नदान सेवा नोंदणी दालन</p>
    </div>

    <div class="search-bar-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 नाव, फोन नंबर किंवा तारीख शोधा..." oninput="filterCalendar()">
        <select id="filterSelect" class="filter-select" onchange="filterCalendar()">
            <option value="all">सर्व आगामी गुरुवार (Upcoming)</option>
            <option value="available">रिक्त (Available)</option>
            <option value="booked">नोंदणी झालेले (Booked)</option>
            <option value="past">मागील पूर्ण झालेल्या सेवा (Past/Completed)</option>
        </select>
    </div>

    <div id="sectionHeader" class="section-title">🗓 आगामी अन्नदान सेवा (Upcoming Thursdays)</div>
    <div id="calendar" class="calendar-grid">माहिती लोड होत आहे...</div>
</div>

<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h3>अन्नदान सेवा संकल्प नोंदणी</h3>
        <p id="modalDateDisplay" style="text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px;"></p>
        <form id="bookingForm" onsubmit="submitBooking(event)">
            <input type="hidden" id="selectedDate">
            
            <label>अन्नदात्याचे पूर्ण नाव (Full Name):</label>
            <input type="text" id="devoteeName" required placeholder="उदा. राजेश विठ्ठल पाटील">

            <label>मोबाइल नंबर (WhatsApp Number):</label>
            <input type="tel" id="phoneNumber" required pattern="[0-9]{10}" placeholder="१० अंकी मोबाइल नंबर">

            <label>अन्नदानाचा मेनू (Menu Details):</label>
            <textarea id="foodType" rows="2" required placeholder="उदा. पुरी भाजी, दाल खिचडी, शिरा"></textarea>

            <div style="background: #fff8e7; border: 1px dashed var(--gold); padding: 8px; border-radius: 8px; font-size: 0.85rem; color: #8a6d1c; margin-top: 12px; font-weight: bold; text-align: center;">
                ✨ **विशेष मान:** गुरुवारी सकाळी ७:०० वाजता होणाऱ्या महाआरतीचे मुख्य मानकरी/यजमान आपण असाल.
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">रद्द करा</button>
                <button type="submit" class="btn-submit">संकल्प नोंदवा</button>
            </div>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://tkftorwnoadfsvknldxw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5TGMP5zI5l4anJKhE5CxdQ_zqrHRCmC";
    const ADMIN_PASSWORD = "admin123";

    const GREEN_ID_INSTANCE = "710722741730";
    const GREEN_API_TOKEN = "cc09209b59c64b49babaed7d19ac0122e744af10ce8d47329f";
    const TEMPLE_GROUP_CHAT_ID = "120363413708644281@g.us";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let isAdmin = false;
    let allBookingsData = [];

    // Instant Play on First Screen Touch
    let audioStarted = false;
    function autoPlayMantraOnUserTouch() {
        if (!audioStarted) {
            const audio = document.getElementById('mantraAudio');
            audio.play().then(() => {
                audioStarted = true;
                document.getElementById('musicIcon').innerText = "🔊";
                document.getElementById('musicText').innerText = "मंत्रध्वनी सुरू आहे";
            }).catch(e => console.log("Interaction needed"));
        }
    }

    document.addEventListener('click', autoPlayMantraOnUserTouch, { once: true });
    document.addEventListener('touchstart', autoPlayMantraOnUserTouch, { once: true });

    function getThursdaysList(count = 200) {
        const thursdays = [];
        let date = new Date();
        while (date.getDay() !== 4) {
            date.setDate(date.getDate() + 1);
        }
        for (let i = 0; i < count; i++) {
            thursdays.push(date.toISOString().split('T')[0]);
            date.setDate(date.getDate() + 7);
        }
        return thursdays;
    }

    function formatDateToMarathi(dateStr) {
        const dateObj = new Date(dateStr);
        return dateObj.toLocaleDateString('mr-IN', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadCalendar() {
        try {
            const { data: bookings, error } = await db.from('thursday_bookings').select('*');
            if (error) console.error(error);
            allBookingsData = bookings || [];
            renderCalendar();
        } catch (e) {
            console.error("Database connection error:", e);
        }
    }

    function renderCalendar() {
        const calendarEl = document.getElementById('calendar');
        const sectionHeader = document.getElementById('sectionHeader');
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        const filterVal = document.getElementById('filterSelect').value;

        const bookingMap = {};
        allBookingsData.forEach(b => { bookingMap[b.thursday_date] = b; });

        const thursdays = getThursdaysList();
        calendarEl.innerHTML = "";

        if (filterVal === 'past') {
            sectionHeader.innerText = "📜 मागील पूर्ण झालेल्या सेवा (Past / Completed)";
        } else {
            sectionHeader.innerText = "🗓 आगामी अन्नदान सेवा (Upcoming Thursdays)";
        }

        let count = 0;

        if (filterVal === 'past') {
            allBookingsData.filter(b => b.food_type && b.food_type.includes("[COMPLETED]")).forEach(booked => {
                const card = document.createElement('div');
                card.className = "card completed";
                card.innerHTML = `
                    <div class="date-title">🗓 ${formatDateToMarathi(booked.thursday_date)}</div>
                    <span class="badge completed">✅ सेवा पूर्ण झाली</span>
                    <div class="info-text"><strong>अन्नदाते:</strong> ${booked.devotee_name}</div>
                    <div class="info-text"><strong>मेनू:</strong> ${booked.food_type.replace("[COMPLETED]", "")}</div>
                `;
                calendarEl.appendChild(card);
                count++;
            });
            if (count === 0) calendarEl.innerHTML = "<p>कोणतीही मागील पूर्ण झालेली सेवा सापडली नाही.</p>";
            return;
        }

        thursdays.forEach(dateStr => {
            const booked = bookingMap[dateStr];
            const formattedDate = formatDateToMarathi(dateStr);

            if (booked && booked.food_type && booked.food_type.includes("[COMPLETED]")) return;

            if (filterVal === 'available' && booked) return;
            if (filterVal === 'booked' && !booked) return;

            if (searchVal) {
                const match = formattedDate.toLowerCase().includes(searchVal) ||
                    (booked && booked.devotee_name.toLowerCase().includes(searchVal)) ||
                    (booked && booked.phone_number.includes(searchVal));
                if (!match) return;
            }

            const card = document.createElement('div');
            card.className = `card ${booked ? 'booked' : 'available'}`;
            
            let content = `<div class="date-title">🗓 ${formattedDate}</div>`;
            
            if (booked) {
                content += `<span class="badge booked">बुकिंग पूर्ण (Booked)</span>`;
                content += `<div class="info-text"><strong>अन्नदाते:</strong> ${booked.devotee_name}</div>`;
                content += `<div class="info-text"><strong>मेनू:</strong> ${booked.food_type}</div>`;
                
                if (isAdmin) {
                    content += `<div class="info-text"><strong>फोन:</strong> ${booked.phone_number}</div>`;
                    content += `<button class="btn-complete" onclick="markServiceCompleted(${booked.id}, '${dateStr}', '${booked.devotee_name}', '${booked.phone_number}', '${booked.food_type}')">✨ अन्नदान सेवा पूर्ण झाली (Send WhatsApp Photo)</button>`;
                    content += `<button class="btn-delete" onclick="deleteBooking(${booked.id})">नोंदणी रद्द करा</button>`;
                } else {
                    content += `<div class="info-text"><strong>फोन:</strong> ••••••••••</div>`;
                }
            } else {
                content += `<span class="badge available">रिक्त आहे (Available)</span>`;
                content += `<button class="btn-book" onclick="openModal('${dateStr}')">हे नाव नोंदवा</button>`;
            }
            
            card.innerHTML = content;
            calendarEl.appendChild(card);
            count++;
        });

        if (count === 0) calendarEl.innerHTML = "<p>कोणताही डेटा उपलब्ध नाही.</p>";
    }

    function filterCalendar() { renderCalendar(); }

    function toggleAdmin() {
        if (!isAdmin) {
            const pwd = prompt("प्रशासक पासवर्ड टाका:");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('toggleAdminBtn').innerText = "लॉगआउट (Logout)";
                alert("प्रशासक मोड सुरू झाला आहे!");
                renderCalendar();
            } else if (pwd !== null) alert("चुकीचा पासवर्ड!");
        } else {
            isAdmin = false;
            document.getElementById('toggleAdminBtn').innerText = "प्रशासक लॉगिन (Admin)";
            renderCalendar();
        }
    }

    function openModal(dateStr) {
        document.getElementById('selectedDate').value = dateStr;
        document.getElementById('modalDateDisplay').innerText = formatDateToMarathi(dateStr);
        document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('bookingModal').style.display = 'none';
        document.getElementById('bookingForm').reset();
    }

    async function submitBooking(event) {
        event.preventDefault();
        const dateStr = document.getElementById('selectedDate').value;
        const name = document.getElementById('devoteeName').value;
        const phone = document.getElementById('phoneNumber').value;
        const food = document.getElementById('foodType').value;

        const { error } = await db.from('thursday_bookings').insert([
            { thursday_date: dateStr, devotee_name: name, phone_number: phone, food_type: food }
        ]);

        if (error) {
            alert("त्रुटी आली: " + error.message);
        } else {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            alert("श्री गजानन महाराज प्रसन्न! तुमची नोंदणी यशस्वी झाली आहे.");
            sendDirectWhatsAppGroupMessage(dateStr, name, phone, food);
            closeModal();
            loadCalendar();
        }
    }

    async function deleteBooking(id) {
        if (confirm("ही नोंदणी डिलीट करायची का?")) {
            await db.from('thursday_bookings').delete().eq('id', id);
            loadCalendar();
        }
    }

    async function sendDirectWhatsAppGroupMessage(date, name, phone, food) {
        const formattedDate = formatDateToMarathi(date);
        const groupMessageText = `🛕 *नवीन अन्नदान सेवा नोंदणी!*\n🗓 *दिनांक:* ${formattedDate}\n👤 *अन्नदाते:* ${name}\n📞 *संपर्क:* ${phone}\n🍱 *मेनू:* ${food}`;
        const groupUrl = `https://api.green-api.com/waInstance${GREEN_ID_INSTANCE}/sendMessage/${GREEN_API_TOKEN}`;

        let cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length === 10) cleanPhone = "91" + cleanPhone;
        const devoteeChatId = `${cleanPhone}@c.us`;

        const devoteeMessageText = `जय गजानन! 🙏\n\n*श्री गजानन महाराज संस्थान वडशेद (जुने)*\n\nसादर प्रणाम *${name}* जी,\nतुमची गुरुवार अन्नदान सेवा नोंदणी यशस्वी झाली आहे! 🎉\n\n🗓 *दिनांक:* ${formattedDate}\n🍱 *मेनू:* ${food}\n🛕 *महाआरती:* गुरुवारी सकाळी ७:०० वाजता\n\n*(टीप: अन्नदानाच्या एक दिवस आधी बुधवारी तुम्हाला रिमाइंडर पाठवला जाईल.)*`;

        try {
            await fetch(groupUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chatId: TEMPLE_GROUP_CHAT_ID, message: groupMessageText }) });
            await fetch(groupUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chatId: devoteeChatId, message: devoteeMessageText }) });
        } catch (err) { console.error(err); }
    }

    async function markServiceCompleted(id, dateStr, name, phone, currentFood) {
        if (confirm(`तुम्हाला ${name} यांची सेवा पूर्ण झाली म्हणून चिन्हांकित करायचे आहे का?`)) {
            await db.from('thursday_bookings').update({ food_type: currentFood + " [COMPLETED]" }).eq('id', id);
            loadCalendar();
        }
    }

    function toggleMusic() {
        const audio = document.getElementById('mantraAudio');
        const icon = document.getElementById('musicIcon');
        const text = document.getElementById('musicText');

        if (audio.paused) {
            audio.play().then(() => {
                audioStarted = true;
                icon.innerText = "🔊";
                text.innerText = "मंत्रध्वनी सुरू आहे";
            }).catch(() => {
                alert("कृपया स्क्रीनवर कुठेही स्पर्श करा.");
            });
        } else {
            audio.pause();
            icon.innerText = "🪕";
            text.innerText = "मंत्रध्वनी सुरू करा";
        }
    }

    loadCalendar();
</script>
</body>
</html>
