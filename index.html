<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री गजानन महाराज संस्थान वडशेद - गुरुवार अन्नदान सेवा</title>
    <!-- Premium Marathi Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #c62828;
            --primary-dark: #8e0000;
            --secondary: #1b5e20;
            --accent-gold: #fbc02d;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Tiro Devanagari Marathi', 'Poppins', serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ebd9b4 0.75px, transparent 0.75px);
            background-size: 15px 15px;
            margin: 0;
            padding: 15px;
            color: var(--text-color);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            border: 2px solid #f4e8c1;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed #e2d2a4;
            padding-bottom: 22px;
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin: 10px 0 6px 0;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .header p {
            font-size: 1.15rem;
            color: #555;
            margin: 0;
            font-weight: 500;
        }

        .admin-top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .admin-btn {
            background: #2d3748;
            color: #fff;
            border: 1px solid #4a5568;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .admin-btn:hover {
            background: #1a202c;
            transform: translateY(-2px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 22px;
        }

        .card {
            border-radius: 14px;
            padding: 22px;
            background: #fff;
            border: 1px solid #e8e1d1;
            box-shadow: 0 6px 16px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        .card.booked {
            border-left: 6px solid var(--primary);
            background: linear-gradient(180deg, #ffffff 0%, #fff5f5 100%);
        }

        .card.available {
            border-left: 6px solid var(--secondary);
            background: linear-gradient(180deg, #ffffff 0%, #f4fff4 100%);
        }

        .date-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1a202c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .badge.booked {
            background-color: var(--primary);
            box-shadow: 0 2px 8px rgba(198, 40, 40, 0.3);
        }

        .badge.available {
            background-color: var(--secondary);
            box-shadow: 0 2px 8px rgba(27, 94, 32, 0.3);
        }

        .info-text {
            font-size: 0.98rem;
            line-height: 1.6;
            margin: 8px 0;
            color: #333;
        }

        .btn-book {
            display: block;
            width: 100%;
            margin-top: 18px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: 'Tiro Devanagari Marathi', serif;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
            transition: all 0.3s ease;
        }

        .btn-book:hover {
            background: linear-gradient(135deg, #1b5e20 0%, #0d3b10 100%);
            transform: scale(1.02);
        }

        .btn-delete {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: var(--primary-dark);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 18px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            border: 2px solid #f4e8c1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 2px solid #fce8e6;
            padding-bottom: 10px;
        }

        .modal-content label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #444;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            margin-top: 6px;
            padding: 11px;
            border: 1px solid #cbd5e0;
            border-radius: 9px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .modal-content input:focus, .modal-content textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }

        .btn-cancel {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            font-size: 0.95rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-top-bar">
        <button id="toggleAdminBtn" class="admin-btn" onclick="toggleAdmin()">प्रशासक लॉगिन (Admin)</button>
    </div>
    
    <div class="header">
        <h1>🛕 श्री गजानन महाराज संस्थान वडशेद (जुने)</h1>
        <p>गुरुवार महाप्रसाद / अन्नदान सेवा नोंदणी दालन</p>
    </div>

    <div id="calendar" class="calendar-grid">माहिती लोड होत आहे...</div>
</div>

<!-- Modal Dialog -->
<div id="bookingModal" class="modal">
    <div class="modal-content">
        <h3>अन्नदान सेवा नोंदणी</h3>
        <p id="modalDateDisplay" style="text-align: center; font-weight: bold; color: var(--primary); font-size: 1.1rem;"></p>
        <form id="bookingForm" onsubmit="submitBooking(event)">
            <input type="hidden" id="selectedDate">
            
            <label>पूर्ण नाव (Full Name):</label>
            <input type="text" id="devoteeName" required placeholder="तुमचे नाव टाका">
            
            <label>मोबाइल नंबर (Phone Number):</label>
            <input type="tel" id="phoneNumber" required pattern="[0-9]{10}" placeholder="१० अंकी मोबाइल नंबर">
            
            <label>अन्नदानाचा मेनू/प्रकार (Menu Details):</label>
            <textarea id="foodType" rows="3" required placeholder="उदा. पुरी भाजी, दाल खिचडी, शिरा"></textarea>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">रद्द करा</button>
                <button type="submit" class="btn-submit">नोंदणी करा</button>
            </div>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://tkftorwnoadfsvknldxw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5TGMP5zI5l4anJKhE5CxdQ_zqrHRCmC";
    const ADMIN_PASSWORD = "admin123";

    // Green-API Configuration
    const GREEN_ID_INSTANCE = "710722741730";
    const GREEN_API_TOKEN = "cc09209b59c64b49babaed7d19ac0122e744af10ce8d47329f";
    const TEMPLE_GROUP_CHAT_ID = "120363413708644281@g.us";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let isAdmin = false;

    // Unlimited Thursday Generation (Generates upcoming 500 Thursdays ~ 10 Years)
    function getUpcomingThursdays(count = 500) {
        const thursdays = [];
        let date = new Date();
        while (date.getDay() !== 4) {
            date.setDate(date.getDate() + 1);
        }
        for (let i = 0; i < count; i++) {
            thursdays.push(date.toISOString().split('T')[0]);
            date.setDate(date.getDate() + 7);
        }
        return thursdays;
    }

    function formatDateToMarathi(dateStr) {
        const dateObj = new Date(dateStr);
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        return dateObj.toLocaleDateString('mr-IN', options);
    }

    async function loadCalendar() {
        const calendarEl = document.getElementById('calendar');
        calendarEl.innerHTML = "<p style='text-align:center; font-size:1.1rem; color:#666;'>माहिती लोड होत आहे...</p>";

        const { data: bookings, error } = await db.from('thursday_bookings').select('*');
        if (error) { 
            console.error(error); 
            calendarEl.innerHTML = "<p style='text-align:center; color:red;'>त्रुटी आली आहे. कृपया पेज रिफ्रेश करा.</p>";
            return; 
        }

        const bookingMap = {};
        if (bookings) {
            bookings.forEach(b => { bookingMap[b.thursday_date] = b; });
        }

        const thursdays = getUpcomingThursdays();
        calendarEl.innerHTML = "";

        thursdays.forEach(dateStr => {
            const booked = bookingMap[dateStr];
            const card = document.createElement('div');
            card.className = `card ${booked ? 'booked' : 'available'}`;
            
            const formattedDate = formatDateToMarathi(dateStr);
            let content = `<div class="date-title">🗓 ${formattedDate}</div>`;
            
            if (booked) {
                content += `<span class="badge booked">बुकिंग पूर्ण (Booked)</span>`;
                content += `<div class="info-text"><strong>अन्नदाते:</strong> ${booked.devotee_name}</div>`;
                content += `<div class="info-text"><strong>मेनू:</strong> ${booked.food_type}</div>`;
                
                if (isAdmin) {
                    content += `<div class="info-text"><strong>फोन:</strong> ${booked.phone_number}</div>`;
                    content += `<button class="btn-delete" onclick="deleteBooking(${booked.id})">नोंदणी रद्द करा</button>`;
                } else {
                    content += `<div class="info-text"><strong>फोन:</strong> ••••••••••</div>`;
                }
            } else {
                content += `<span class="badge available">रिक्त आहे (Available)</span>`;
                content += `<button class="btn-book" onclick="openModal('${dateStr}')">हे नाव नोंदवा</button>`;
            }
            
            card.innerHTML = content;
            calendarEl.appendChild(card);
        });
    }

    function toggleAdmin() {
        if (!isAdmin) {
            const pwd = prompt("प्रशासक पासवर्ड टाका:");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('toggleAdminBtn').innerText = "लॉगआउट (Logout)";
                alert("प्रशासक मोड सुरू झाला आहे!");
                loadCalendar();
            } else if (pwd !== null) {
                alert("चुकीचा पासवर्ड!");
            }
        } else {
            isAdmin = false;
            document.getElementById('toggleAdminBtn').innerText = "प्रशासक लॉगिन (Admin)";
            loadCalendar();
        }
    }

    function openModal(dateStr) {
        document.getElementById('selectedDate').value = dateStr;
        document.getElementById('modalDateDisplay').innerText = formatDateToMarathi(dateStr);
        document.getElementById('bookingModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('bookingModal').style.display = 'none';
        document.getElementById('bookingForm').reset();
    }

    async function submitBooking(event) {
        event.preventDefault();
        const dateStr = document.getElementById('selectedDate').value;
        const name = document.getElementById('devoteeName').value;
        const phone = document.getElementById('phoneNumber').value;
        const food = document.getElementById('foodType').value;

        const { data, error } = await db.from('thursday_bookings').insert([
            { thursday_date: dateStr, devotee_name: name, phone_number: phone, food_type: food }
        ]);

        if (error) {
            alert("नोंदणी करताना त्रुटी आली: " + error.message);
        } else {
            alert("श्री गजानन महाराज प्रसन्न! तुमची नोंदणी यशस्वी झाली आहे.");
            sendDirectWhatsAppGroupMessage(dateStr, name, phone, food);
            closeModal();
            loadCalendar();
        }
    }

    async function deleteBooking(id) {
        if (confirm("तुम्हाला खात्री आहे का? ही नोंदणी डिलीट केली जाईल.")) {
            const { error } = await db.from('thursday_bookings').delete().eq('id', id);
            if (error) {
                alert("डिलीट करण्यात त्रुटी: " + error.message);
            } else {
                loadCalendar();
            }
        }
    }

    // Direct Background WhatsApp Message Trigger
    async function sendDirectWhatsAppGroupMessage(date, name, phone, food) {
        const formattedDate = formatDateToMarathi(date);
        const messageText = `🛕 *नवीन अन्नदान नोंदणी!*\n🗓 *दिनांक:* ${formattedDate}\n👤 *अन्नदाते:* ${name}\n📞 *संपर्क:* ${phone}\n🍱 *मेनू:* ${food}`;
        const url = `https://api.green-api.com/waInstance${GREEN_ID_INSTANCE}/sendMessage/${GREEN_API_TOKEN}`;

        try {
            await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chatId: TEMPLE_GROUP_CHAT_ID,
                    message: messageText
                })
            });
            console.log("WhatsApp message sent successfully!");
        } catch (err) {
            console.error("WhatsApp Message Error:", err);
        }
    }

    loadCalendar();
</script>
</body>
</html>
